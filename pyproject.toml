[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-classification"
version = "0.1.0"
description = "EmoSet-118K emotion classification with two-phase transfer learning (Marimo notebook)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jakub Zaręba"}]
keywords = ["computer-vision", "emotion-classification", "vision-transformer", "transfer-learning", "marimo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.12",
    "timm>=1.0",
    "datasets>=2.19",
    "marimo>=0.23",
    "scikit-learn>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "molab>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]